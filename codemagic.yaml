workflows:
  ios_testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        BUNDLE_ID: com.applixus.etkinlikBul
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials # Define on Codemagic: APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY
    scripts:
      - name: Initialize keychain & fetch signing files (App Store)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter clean & pub get
        script: |
          flutter clean
          flutter pub get
      - name: Build IPA (App Store)
        script: |
          flutter build ipa --release --export-method app-store
    artifacts:
      - "**/*.ipa"
      - "**/xcarchive/**"
      - "**/dSYM.zip"
    publishing:
      app_store_connect:
        auth: api_key
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        key_identifier: $APP_STORE_CONNECT_KEY_IDENTIFIER
        private_key: $APP_STORE_CONNECT_PRIVATE_KEY
        submit_to_testflight: true

  ios_adhoc:
    name: iOS AdHoc (share to a device)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        BUNDLE_ID: com.applixus.etkinlikBul
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
    scripts:
      - name: Initialize keychain & fetch signing files (Ad Hoc)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_ADHOC --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter clean & pub get
        script: |
          flutter clean
          flutter pub get
      - name: Build IPA (Ad Hoc)
        script: |
          flutter build ipa --release --export-method ad-hoc
    artifacts:
      - "**/*.ipa"
      - "**/xcarchive/**"
      - "**/dSYM.zip"
    publishing:
      email:
        recipients:
          - $CM_EMAIL
        notify:
          success: true
          failure: false

